name: Release
on:
  push:
    branches:
      - master
      - beta
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    # Yayından ÖNCE doğrula. Bu kapı yokken iki sürüm (5.2.0, 5.2.1) bozuk
    # çıktı; ikisi de npm'e ulaştıktan sonra fark edildi.
    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Unit tests
      run: npm run test:unit

    - name: Release package
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: npm run release